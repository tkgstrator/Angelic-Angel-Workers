name: Deploy to Cloudflare Workers
on:
  pull_request:
    branches:
      - master
      - main
      - develop
    types: [closed]
  workflow_dispatch:

jobs:
  deploy:
    name: Wrangler Deploy
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock', '**/package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Determine environment
        env:
          ANGELIC_TARGET_BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
          ANGELIC_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$ANGELIC_TARGET_BRANCH" == "$ANGELIC_DEFAULT_BRANCH" ]]; then
            echo "DEPLOY_COMMAND=deploy --env= --minify" >> $GITHUB_ENV
          else
            echo "DEPLOY_COMMAND=deploy --env staging --minify" >> $GITHUB_ENV
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Read installed Wrangler version
        id: wrangler
        run: bun -e "const p = await Bun.file('node_modules/wrangler/package.json').json(); console.log('version=' + p.version)" >> "$GITHUB_OUTPUT"

      # Uncomment when the project uses Prisma (or similar codegen).
      # - name: Generate Prisma client
      #   run: bun run prisma generate

      - name: Wrangler deploy
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: ${{ steps.wrangler.outputs.version }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: ${{ env.DEPLOY_COMMAND }}
